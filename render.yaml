# Render blueprint — deploys Pip at a public URL with HTTPS.
# Push this repo to GitHub, then: Render → New → Blueprint → pick the repo.
services:
  - type: web
    name: pip
    runtime: docker
    plan: starter            # free tier works too; starter avoids cold starts
    healthCheckPath: /api/stats
    autoDeploy: true
    envVars:
      - key: PIP_ENV
        value: production
      - key: PIP_SECRET
        generateValue: true            # stable session signing key
      - key: OAUTH_REDIRECT
        value: https://pip.mixreflect.com/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false                    # set in the Render dashboard (secret)
      - key: GOOGLE_CLIENT_SECRET
        sync: false                    # set in the Render dashboard (secret)
    disk:
      name: pip-data
      mountPath: /app/data             # keeps the SQLite waitlist/scans across deploys
      sizeGB: 1
