# Render blueprint — deploys Cashew (the full app, deep scan + progress) at a
# public HTTPS URL. Render runs a persistent container, so the background scan
# and progress bar work (unlike serverless).
#
# Push this repo to GitHub, then: Render -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: cashew
    runtime: docker
    plan: starter            # free works to test; starter avoids cold-start spin-down
    healthCheckPath: /api/stats
    autoDeploy: true
    envVars:
      - key: PIP_ENV
        value: production
      - key: PIP_SECRET
        generateValue: true            # stable session-signing key
      - key: GMAIL_DEEP
        value: "0"                     # wide smart search (fast). "1" = every email
      - key: OAUTH_REDIRECT
        value: https://heycashew.com/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false                    # set in the Render dashboard (secret)
      - key: GOOGLE_CLIENT_SECRET
        sync: false                    # set in the Render dashboard (secret)
      # Precision filter — set ONE of these (kills the false positives).
      - key: OPENAI_API_KEY
        sync: false                    # OpenAI (default model gpt-4o-mini)
      # - key: ANTHROPIC_API_KEY
      #   sync: false                  # Claude alternative (default model claude-opus-4-8)
      # - key: CASHEW_CLASSIFIER_MODEL
      #   value: gpt-4o                # optional: override the default model
    disk:
      name: cashew-data
      mountPath: /app/data             # SQLite waitlist + scans persist across deploys
      sizeGB: 1
